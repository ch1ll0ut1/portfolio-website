name: 'CI/CD Pipeline'

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Reads the pnpm version from the `packageManager` field in package.json
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Unused files, exports and dependencies
      - name: Check for dead code
        run: pnpm knip

      # The committed CSS Module declarations must match the stylesheets
      - name: Check CSS Module types
        run: pnpm css-types --check

      - name: Type check
        run: pnpm exec tsc --noEmit

      # With coverage, so the thresholds in vitest.config.ts are enforced
      - name: Run tests
        run: pnpm test:coverage

      # `pnpm build` would re-run lint and tsc, which the steps above already did
      - name: Build application
        run: pnpm exec next build

      # Same-language links and reciprocal hreflang over every page in the
      # sitemap, against the build just made (scripts/i18n-check.mjs)
      - name: Check the two languages against each other
        run: |
          pnpm exec next start -p 3100 &
          for attempt in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3100/sitemap.xml && break
            sleep 1
          done
          pnpm i18n-check --base http://localhost:3100
